name: Daily Catalogue Metadata Enrichment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/catalogue-enrichment.yml"
      - "scripts/enrich_catalog_details.py"
  workflow_run:
    workflows: ["Daily Catalogue Sync"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bluejetty_batch:
        description: "Maximum Blue Jetty detail records to inspect (1-500)"
        required: false
        default: "500"
        type: string
      fedora_batch:
        description: "Maximum priority Fedora package pages to inspect (1-100)"
        required: false
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: mta-catalogue-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLUEJETTY_ENRICH_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.bluejetty_batch || '500' }}
      FEDORA_ENRICH_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.fedora_batch || '100' }}
      ENRICH_CONCURRENCY: "2"
      ENRICHMENT_MAX_BATCHES: "4"
    steps:
      - name: Check database configuration
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is required; no enrichment was run."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile enrichment code
        run: python -m py_compile app.py catalog_sources.py open_catalog_sources.py fedora_catalog_source.py scripts/enrich_catalog_details.py
      - name: Enrich existing public catalogue metadata
        run: PYTHONPATH=. python scripts/enrich_catalog_details.py
