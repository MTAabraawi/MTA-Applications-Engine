name: Catalogue Metadata Audit and Enrichment

on:
  push:
    branches: [audit/catalogue-metadata-enrichment-quality]
    paths:
      - "scripts/enrich_github_catalog.py"
      - "scripts/catalogue_quality_report.py"
      - "scripts/compare_catalogue_quality.py"
      - "scripts/validate_catalogue_icon_urls.py scripts/enrich_google_play_icons.py"
      - "scripts/enrich_google_play_icons.py"
      - "tests/test_github_catalog_enrichment.py"
      - ".github/workflows/catalogue-metadata-audit.yml"

permissions:
  contents: write

concurrency:
  group: mta-catalogue-metadata-audit-v2
  cancel-in-progress: false

jobs:
  audit-and-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_CATALOGUE_DIR: catalogue_data
      BLUEJETTY_ENRICH_BATCH_SIZE: "500"
      FEDORA_ENRICH_BATCH_SIZE: "100"
      ENRICH_CONCURRENCY: "4"
      ENRICHMENT_MAX_BATCHES: "1000"
      ENRICHMENT_MAX_RUNTIME_MINUTES: "330"
      CATALOGUE_QUALITY_REPORT: "reports/catalogue-quality-report.json"
      CATALOGUE_QUALITY_BASELINE: "reports/catalogue-quality-baseline.json"
      CATALOGUE_QUALITY_COMPARISON: "reports/catalogue-quality-comparison.json"
      CATALOGUE_ICON_REPORT: "reports/catalogue-icon-validation.json"
      ICON_VALIDATION_PER_SOURCE: "15"
      ICON_VALIDATION_CONCURRENCY: "6"
      GOOGLE_PLAY_ICON_REPORT: "reports/google-play-icon-enrichment.json"
      GOOGLE_PLAY_ICON_ENRICH_LIMIT: "1000"
      GOOGLE_PLAY_ICON_ENRICH_CONCURRENCY: "6"
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/catalogue-metadata-enrichment-quality
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile enrichment and audit modules
        run: |
          python -m py_compile github_catalog_store.py fedora_catalog_source.py open_catalog_sources.py scripts/enrich_github_catalog.py scripts/catalogue_quality_report.py scripts/compare_catalogue_quality.py scripts/validate_catalogue_icon_urls.py
      - name: Run complete Python regression suite
        run: pytest -q
      - name: Capture immutable main-branch quality baseline before enrichment
        run: |
          mkdir -p reports
          git fetch origin main
          git show origin/main:catalogue_data/indexes/stats.json > reports/catalogue-quality-baseline.json
      - name: Enrich missing Blue Jetty and Fedora metadata from official source detail pages
        run: python scripts/enrich_github_catalog.py
      - name: Fill missing Android icons from official Google Play Open Graph metadata
        run: python scripts/enrich_google_play_icons.py
      - name: Rebuild indexes and produce source-aware quality report
        run: |
          python - <<'PY'
          import os
          from github_catalog_store import GitHubCatalogueStore
          store = GitHubCatalogueStore(os.environ["GITHUB_CATALOGUE_DIR"])
          manifest = store.rebuild_indexes()
          print(f"Rebuilt indexes for {manifest['record_count']} catalogue records")
          PY
          python scripts/catalogue_quality_report.py
          python scripts/compare_catalogue_quality.py
          python scripts/validate_catalogue_icon_urls.py
      - name: Commit audited catalogue snapshot and report to this branch only
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- catalogue_data reports/catalogue-quality-baseline.json reports/catalogue-quality-report.json reports/catalogue-quality-comparison.json reports/catalogue-icon-validation.json reports/google-play-icon-enrichment.json)" ]; then
            echo "No catalogue metadata changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue_data/ reports/catalogue-quality-baseline.json reports/catalogue-quality-report.json reports/catalogue-quality-comparison.json reports/catalogue-icon-validation.json reports/google-play-icon-enrichment.json
          git commit -m "Apply source-verified catalogue metadata enrichment and report"
          git fetch origin audit/catalogue-metadata-enrichment-quality
          git rebase origin/audit/catalogue-metadata-enrichment-quality
          git push origin HEAD:audit/catalogue-metadata-enrichment-quality
