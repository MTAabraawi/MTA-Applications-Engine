name: Live Catalogue Source Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mta-catalogue-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPLE_COUNTRY: us
      APPLE_SEARCH_TERMS: browser,office
      APPLE_LIMIT: "20"
      WINGET_SEARCH_TERMS: browser,office
      WINGET_LIMIT: "24"
      FLATHUB_MAX_APPS: "20"
      BLUEJETTY_MAX_APPS: "500"
      OPENUSE_MAX_APPS: "500"
      CATALOG_CONCURRENCY: "4"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Fetch live upstream catalogues (metadata only)
        run: python scripts/smoke_catalog_sources.py

  chocolatey-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CHOCOLATEY_PAGE_SIZE: "100"
      CHOCOLATEY_MAX_PAGES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify Chocolatey CLI
        shell: pwsh
        run: choco --version
      - name: Fetch approved Chocolatey Community package metadata
        shell: pwsh
        run: python scripts/smoke_chocolatey.py
