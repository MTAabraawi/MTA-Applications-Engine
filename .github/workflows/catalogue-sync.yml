name: Daily Catalogue Sync

on:
  push:
    branches: [main]
    paths:
      - "catalog_sources.py"
      - "expanded_catalog_sources.py"
      - "sync_catalogs.py"
      - "store_sources.json"
      - ".github/workflows/catalogue-sync.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mta-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APPLE_COUNTRY: ${{ vars.APPLE_COUNTRY || 'us' }}
      FLATHUB_MAX_APPS: "1000"
      APPLE_LIMIT: "100"
      WINGET_LIMIT: "100"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync catalogue metadata
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Daily sync skipped. Add DATABASE_URL as a GitHub Actions repository secret pointing to the persistent PostgreSQL database."
            exit 0
          fi
          python sync_catalogs.py
