name: Daily Catalogue Sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mta-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ secrets.DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APPLE_COUNTRY: ${{ vars.APPLE_COUNTRY || 'us' }}
      FLATHUB_MAX_APPS: "1000"
      APPLE_LIMIT: "100"
      WINGET_LIMIT: "100"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync catalogue metadata
        run: python sync_catalogs.py

  configuration-notice:
    if: ${{ secrets.DATABASE_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain required secret
        run: |
          echo "::warning::Daily sync skipped. Add DATABASE_URL as a GitHub Actions repository secret pointing to the persistent PostgreSQL database."
