name: Python CI

on:
  push:
    branches: [main, audit/catalogue-metadata-enrichment-quality]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mta-python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile application and sync runner
        run: python -m py_compile app.py catalog_sources.py expanded_catalog_sources.py open_catalog_sources.py sync_catalogs.py worker.py scripts/enrich_catalog_details.py scripts/enrich_github_catalog.py scripts/catalogue_quality_report.py scripts/smoke_catalog_sources.py scripts/smoke_chocolatey.py

      - name: Run Python test suite
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        run: npm run check
      - name: Prepare non-production Hyperdrive ID for dry-run
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("wrangler.jsonc")
          p.write_text(p.read_text().replace("REPLACE_WITH_HYPERDRIVE_CONFIG_ID", "00000000000000000000000000000000"))
          PY
      - name: Validate Worker bundle with Wrangler
        run: npx wrangler deploy --dry-run
