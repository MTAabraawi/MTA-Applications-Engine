name: Compact Search Index Validation

on:
  push:
    branches: [repair/compact-search-index]
    paths:
      - "github_catalog_store.py"
      - "worker.js"
      - "tests/test_github_catalog_store.py"
      - "tests/test_github_api_mode.py"
      - ".github/workflows/compact-search-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-search-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            /*
            !/catalogue_data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m py_compile app.py github_catalog_store.py
      - name: Check Worker syntax
        run: node --check worker.js
      - name: Run Git-backed catalogue tests
        run: pytest -q tests/test_github_catalog_store.py tests/test_github_api_mode.py
