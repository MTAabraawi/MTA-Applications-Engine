name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - "catalogue_data/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing Actions secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing Actions secret CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Verify GitHub catalogue snapshot exists
        run: |
          test -s catalogue_data/manifest.json
          test -s catalogue_data/indexes/stats.json
      - name: Install JavaScript Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Check Worker syntax
        run: npm run check

      - name: Validate Worker bundle size
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
