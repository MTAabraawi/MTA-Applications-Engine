name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Validate deployment configuration
        env:
          HYPERDRIVE_CONFIG_ID: ${{ vars.HYPERDRIVE_CONFIG_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$HYPERDRIVE_CONFIG_ID" || (echo "Missing Actions variable HYPERDRIVE_CONFIG_ID" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing Actions secret CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing Actions secret CLOUDFLARE_ACCOUNT_ID" && exit 1)
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("wrangler.jsonc")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              "REPLACE_WITH_HYPERDRIVE_CONFIG_ID",
              os.environ["HYPERDRIVE_CONFIG_ID"],
          )
          if "REPLACE_WITH_HYPERDRIVE_CONFIG_ID" in content:
              raise SystemExit("Hyperdrive placeholder was not replaced")
          path.write_text(content, encoding="utf-8")
          PY

      - name: Install project and test dependencies
        run: uv sync --all-groups

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uvx --from workers-py==1.17.9 pywrangler deploy
