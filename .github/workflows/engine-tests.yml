name: Applications Engine Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "catalog_sources.py"
      - "store_sources.json"
      - "tests/**"
      - "app.py"
      - "worker.js"
      - "package.json"
      - ".github/workflows/engine-tests.yml"
  push:
    branches: [feature/izzyondroid-catalogue]
    paths:
      - "catalog_sources.py"
      - "tests/**"
      - "app.py"
      - "worker.js"
      - "package.json"
      - ".github/workflows/engine-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q
      - name: Run one full live catalogue batch
        env:
          APPLE_SEARCH_TERMS: browser,office,photo
          WINGET_SEARCH_TERMS: browser,office,developer
          ARCH_SEARCH_TERMS: browser,office,developer
          SNAP_SEARCH_TERMS: browser,office,developer
          FLATHUB_MAX_APPS: "30"
        run: |
          python - <<'PY'
          import asyncio
          import json
          from catalog_sources import fetch_all_catalogs

          catalogues = asyncio.run(fetch_all_catalogs())
          expected = {
              "fdroid", "izzyondroid", "snap-store", "flathub", "homebrew-cask",
              "apple-itunes", "apple-macos", "winget-run-community", "arch-linux", "steam", "mta-curated-web",
          }
          report = {name: len(records) for name, records in catalogues.items()}
          print(json.dumps(report, ensure_ascii=False, indent=2))
          missing = sorted(name for name in expected if not report.get(name))
          if missing:
              raise SystemExit("Live catalogue batch returned no records for: " + ", ".join(missing))
          print("All public catalogue connectors returned records in one batch.")
          PY
      - name: Verify live IzzyOnDroid repository index
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://apt.izzysoft.de/fdroid/repo/index-v2.json"
          request = urllib.request.Request(url, headers={"User-Agent": "MTA-Applications-Engine/0.3"})
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"IzzyOnDroid returned HTTP {response.status}")
              payload = json.load(response)
          apps = payload.get("apps") or payload.get("packages")
          if not isinstance(apps, (dict, list)) or not apps:
              raise SystemExit("IzzyOnDroid index is reachable but contains no recognized app entries")
          print(f"IzzyOnDroid live index OK: {len(apps)} entries")
          PY
      - name: Check Python syntax
        run: python -m py_compile app.py catalog_sources.py sync_catalogs.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker syntax
        run: node --check worker.js
