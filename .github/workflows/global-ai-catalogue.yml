name: Global AI Applications Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: mta-global-ai-catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MTA_STORAGE_BACKEND: github
      GITHUB_CATALOGUE_DIR: catalogue_data
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_GLOBAL_HF_MAX_TERMS: "24"
      AI_GLOBAL_HF_PER_TERM: "100"
      AI_GLOBAL_GITHUB_MAX_TERMS: "18"
      AI_GLOBAL_GITHUB_PER_PAGE: "100"
      SYNC_SOURCES: "huggingface-ai-spaces,github-ai-applications"
    steps:
      - name: Check out discovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile discovery code
        run: python -m py_compile expanded_catalog_sources.py sync_catalogs.py github_catalog_store.py
      - name: Test global AI source connectors and storage
        run: pytest -q tests/test_expanded_catalog_sources.py tests/test_store_registry_and_connectors.py tests/test_github_catalog_store.py
      - name: Discover and store global AI applications
        run: python sync_catalogs.py
      - name: Commit global AI catalogue snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- catalogue_data)" ]; then
            echo "No new AI catalogue records or metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue_data/
          git commit -m "Discover global AI applications"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
