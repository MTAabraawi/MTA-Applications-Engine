name: Open VSX Targeted Catalogue Sync

on:
  push:
    branches: ["catalogue-quality-round2"]
    paths:
      - "open_catalog_sources.py"
      - "expanded_catalog_sources.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-vsx-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-open-vsx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import a bounded page of public Open VSX metadata
        env:
          MTA_STORAGE_BACKEND: github
          SYNC_SOURCES: open-vsx
          OPEN_VSX_PAGE_SIZE: "50"
          OPEN_VSX_PAGES: "1"
        run: python sync_catalogs.py
      - name: Commit only the Open VSX catalogue snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue_data
          if git diff --cached --quiet; then
            echo "No Open VSX catalogue changes to commit."
          else
            git commit -m "Sync bounded Open VSX catalogue snapshot"
            git push origin "HEAD:catalogue-quality-round2"
          fi
