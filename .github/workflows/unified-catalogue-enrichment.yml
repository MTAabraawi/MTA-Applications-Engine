name: Unified Catalogue Discovery and Enrichment

on:
  workflow_dispatch:
    inputs:
      run_full_discovery:
        description: "Run all configured public catalogue connectors"
        required: true
        type: boolean
        default: true
  push:
    branches: [feature/unified-catalogue-enrichment]
    paths:
      - "scripts/run_unified_catalogue.py"
      - "scripts/enrich_github_catalog.py"
      - "sync_catalogs.py"
      - "catalog_sources.py"
      - "expanded_catalog_sources.py"
      - "github_catalog_store.py"
      - "store_sources.json"
      - "tests/test_unified_catalogue_pipeline.py"
      - ".github/workflows/unified-catalogue-enrichment.yml"

permissions:
  contents: write

concurrency:
  group: mta-unified-catalogue-enrichment
  cancel-in-progress: false

jobs:
  unified-catalogue:
    if: github.ref == 'refs/heads/feature/unified-catalogue-enrichment'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MTA_STORAGE_BACKEND: github
      GITHUB_CATALOGUE_DIR: catalogue_data
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_COUNTRY: ${{ vars.APPLE_COUNTRY || 'us' }}
      FLATHUB_MAX_APPS: "5000"
      BLUEJETTY_MAX_APPS: "200000"
      BLUEJETTY_PAGE_DELAY: "0.55"
      OPENUSE_MAX_APPS: "50000"
      FIREFOX_ADDON_PAGES: "5"
      WORDPRESS_PLUGIN_PAGES: "5"
      APPBRAIN_API_KEY: ${{ secrets.APPBRAIN_API_KEY }}
      APPBRAIN_ENABLE_SYNC: "false"
      APPBRAIN_MAX_PAGES: "1"
      APPBRAIN_IOS_MAX_PAGES: "1"
      APPBRAIN_ENABLE_IOS: "false"
      APPLE_SEARCH_TERMS: "browser,office,photo,video,education,security,finance,communication,developer,utilities,messaging,maps,health,weather,games,music,social,travel,shopping,news,books,fitness,calendar,notes,scanner,keyboard,cloud,streaming,art,food"
      WINGET_SEARCH_TERMS: "browser,office,photo,video,education,security,finance,communication,developer,utilities,media,archive,terminal,editor,cloud,backup,network,system,design,game"
      ARCH_SEARCH_TERMS: "browser,office,photo,video,education,security,finance,communication,developer,utilities,media,archive,terminal,editor,cloud,backup,network,system,design,game"
      DEBIAN_SEARCH_TERMS: "browser,office,graphics,video,audio,education,security,games,communication,utilities,media,archive,terminal,editor,cloud,backup,network,system,design,game"
      SNAP_SEARCH_TERMS: "browser,office,photo,video,education,security,finance,communication,developer,utilities,media,archive,terminal,editor,cloud,backup,network,system,design,game"
      STEAM_SEARCH_TERMS: "action,adventure,strategy,simulation,rpg,indie,free to play,multiplayer,racing,sports,casual,platformer,puzzle,shooter,role playing"
      APPLE_LIMIT: "100"
      WINGET_LIMIT: "24"
      WINGET_PAGES: "3"
      CATALOG_CONCURRENCY: "4"
      BLUEJETTY_ENRICH_BATCH_SIZE: "100"
      FEDORA_ENRICH_BATCH_SIZE: "15"
      ENRICH_CONCURRENCY: "4"
      ENRICHMENT_MAX_BATCHES: "1000"
      ENRICHMENT_MAX_RUNTIME_MINUTES: "300"
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4
        with:
          ref: feature/unified-catalogue-enrichment
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile unified pipeline
        run: python -m py_compile sync_catalogs.py github_catalog_store.py scripts/enrich_github_catalog.py scripts/run_unified_catalogue.py
      - name: Run catalogue and connector tests
        run: pytest -q tests/test_github_catalog_store.py tests/test_github_api_mode.py tests/test_expanded_catalog_sources.py tests/test_store_registry_and_connectors.py tests/test_unified_catalogue_pipeline.py
      - name: Discover, synchronize, enrich and rebuild all indexes
        run: python scripts/run_unified_catalogue.py
      - name: Commit resumable GitHub-native catalogue snapshot
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- catalogue_data)" ]; then
            echo "No catalogue changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue_data/
          git commit -m "Run unified all-source catalogue discovery and enrichment"
          git fetch origin feature/unified-catalogue-enrichment
          git rebase origin/feature/unified-catalogue-enrichment
          git push origin HEAD:feature/unified-catalogue-enrichment
