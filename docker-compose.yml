services:
  api:
    build: .
    restart: unless-stopped
    environment:
      MTA_STORAGE_BACKEND: github
      GITHUB_CATALOGUE_DIR: /app/catalogue_data
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.mtahqq.dpdns.org,https://mtahqq.dpdns.org}
    volumes:
      - ./catalogue_data:/app/catalogue_data:ro
    ports:
      - "8000:8000"
