[project]
name = "mta-applications-engine"
version = "0.2.0"
description = "Multi-platform application metadata catalogue API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "psycopg>=3.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8.0",
]
